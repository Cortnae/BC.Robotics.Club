<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Benedict College Robotics Club</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap">
<style>
:root{--bg:#eddefc;--surface:#fff;--ink:#3b1a6b;--muted:#6a5f80;--line:#ddd5ea;--accent:#f7eed7;--ok:#1b7f4b;--warn:#b4440e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a0f2e;--surface:#26173f;--ink:#f3eefb;--muted:#b7a8d1;--line:#3d2a5e;--ok:#5fd394;--warn:#ff9a62}}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
main{max-width:720px;margin:0 auto;padding:20px 16px 56px}
select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;max-width:100%}
h1{font-size:clamp(1.8rem,6vw,2.6rem);font-weight:800;line-height:1.1;margin:20px 0 14px;letter-spacing:-.01em}
.dates{display:flex;justify-content:space-between;gap:12px;border-top:3px solid var(--accent);border-bottom:1px solid var(--line);padding:10px 0;margin-bottom:8px}
.dates div{display:flex;flex-direction:column}
.dates small{color:var(--muted);font-size:.8rem}
.dates b{font-weight:600}
.dates div:last-child{text-align:right}
section{margin-top:28px}
h2{font-size:1.15rem;font-weight:800;margin:0 0 8px;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
h2 span{font-weight:400;font-size:.85rem;color:var(--muted)}
ul{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:8px}
li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line)}
li:last-child{border-bottom:0}
.qty{font-weight:600;white-space:nowrap}
.none{color:var(--ok);font-weight:600}
button{font:inherit;font-weight:600;cursor:pointer;border-radius:6px;border:1px solid var(--ink);background:var(--accent);color:#2a0f4f;padding:6px 12px;min-height:36px}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
button.done{background:transparent;color:var(--ok);border-color:var(--ok);cursor:default}
.prep label{display:flex;gap:10px;align-items:center;flex:1;cursor:pointer}
.prep input{width:20px;height:20px;accent-color:var(--ink)}
.prep input:checked + span{text-decoration:line-through;color:var(--muted)}
.hint{color:var(--muted);font-size:.9rem;margin:8px 0 0}
.club{font-weight:800;font-size:1.05rem;color:var(--ink);padding-bottom:12px;margin-bottom:16px;border-bottom:3px solid var(--accent)}
</style>
</head>
<body>
<main>
  <div class="club">Benedict College Robotics Club</div>
  <label for="pick" class="hint" style="display:block;margin:0 0 6px">Project</label>
  <select id="pick"></select>

  <h1 id="title"></h1>
  <div class="dates">
    <div><small>Start date</small><b id="start"></b></div>
    <div><small>End date</small><b id="end"></b></div>
  </div>

  <section>
    <h2>Material needed</h2>
    <ul id="needed"></ul>
  </section>
  <section>
    <h2>Material on hand</h2>
    <ul id="onhand"></ul>
  </section>
  <section>
    <h2>Material to order <span id="reqcount"></span></h2>
    <ul id="toorder"></ul>
    <p class="hint">Tap Request and the project manager will see it. Quantity to order is needed minus on hand.</p>
  </section>
  <section>
    <h2>Prep needed <span id="prepcount"></span></h2>
    <ul id="prep" class="prep"></ul>
  </section>
</main>

<script>
// Update Project as I get more information Need to get names and project names//
var projects = [
  { title: "Robo Boat", start: "Aug 17, 2026", end: "Feb 24, 2027",
    materials: [
      { name: "Wed Line Penetrator", needed: 4, onhand: 1 },
      { name: "Xbox Cobtroller", needed: 1, onhand: 0 },
      { name: "Camera", needed: 2, onhand: 0 },
    ],
    prep: ["Troubleshooting", "Program electronics", "Modify Compisition"] },

  { title: "Robot Car", start: "September13, 2026", end: "Jan 26, 2027",
    materials: [
      { name: "Bolts", needed: 6, onhand: 2 },
      { name: "Speakers", needed: 1, onhand: 0 },
      { name: "M3 screws (pack)", needed: 3, onhand: 3 }
    ],
    prep: ["Finalize car design", "Order speakers", "Sort screws by size", "Order bolts"] }
];
var requested = {};   // "projectIndex:materialIndex" -> true
var checked = {};     // "projectIndex:prepIndex" -> true
var cur = 0;

var $ = function (id) { return document.getElementById(id); };

function render() {
  var p = projects[cur];
  $("title").textContent = p.title;
  $("start").textContent = p.start;
  $("end").textContent = p.end;

  $("needed").innerHTML = "";
  $("onhand").innerHTML = "";
  $("toorder").innerHTML = "";
  var orderRows = 0, reqs = 0;

  p.materials.forEach(function (m, i) {
    addRow($("needed"), m.name, m.needed);
    addRow($("onhand"), m.name, m.onhand);
    var need = Math.max(0, m.needed - m.onhand);
    if (need > 0) {
      orderRows++;
      var li = document.createElement("li");
      var left = document.createElement("span");
      left.innerHTML = "<span></span>";
      left.firstChild.textContent = m.name;
      var right = document.createElement("span");
      var q = document.createElement("span");
      q.className = "qty"; q.textContent = need + "  ";
      var b = document.createElement("button");
      var key = cur + ":" + i;
      if (requested[key]) { b.textContent = "Requested"; b.className = "done"; b.disabled = true; reqs++; }
      else {
        b.textContent = "Request";
        b.onclick = function () { requested[key] = true; render(); };
      }
      right.appendChild(q); right.appendChild(b);
      li.appendChild(left); li.appendChild(right);
      $("toorder").appendChild(li);
    }
  });
  if (!orderRows) {
    var n = document.createElement("li");
    n.innerHTML = '<span class="none">Nothing to order. You have everything.</span>';
    $("toorder").appendChild(n);
  }
  $("reqcount").textContent = orderRows ? reqs + " of " + orderRows + " requested" : "";

  $("prep").innerHTML = "";
  var done = 0;
  p.prep.forEach(function (t, i) {
    var key = cur + ":" + i;
    var li = document.createElement("li");
    var lab = document.createElement("label");
    var cb = document.createElement("input");
    cb.type = "checkbox"; cb.checked = !!checked[key];
    if (cb.checked) done++;
    cb.onchange = function () { checked[key] = cb.checked; render(); };
    var sp = document.createElement("span"); sp.textContent = t;
    lab.appendChild(cb); lab.appendChild(sp); li.appendChild(lab);
    $("prep").appendChild(li);
  });
  $("prepcount").textContent = done + " of " + p.prep.length + " done";
}

function addRow(list, name, qty) {
  var li = document.createElement("li");
  var a = document.createElement("span"); a.textContent = name;
  var b = document.createElement("span"); b.className = "qty"; b.textContent = qty;
  li.appendChild(a); li.appendChild(b); list.appendChild(li);
}

projects.forEach(function (p, i) {
  var o = document.createElement("option"); o.value = i; o.textContent = p.title;
  $("pick").appendChild(o);
});
$("pick").onchange = function () { cur = +this.value; render(); };
render();
</script>
</body>
</html>
